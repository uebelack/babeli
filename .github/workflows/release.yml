name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the full history

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check tag matches all package versions
        run: |
          for f in package.json packages/*/package.json; do
            test "v$(node -p "require('./$f').version")" = "$GITHUB_REF_NAME" || { echo "$f does not match $GITHUB_REF_NAME"; exit 1; }
          done

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      # pnpm pack replaces workspace:* versions and applies publishConfig.
      - name: Pack
        run: pnpm --filter "./packages/*" --filter "!@babeli/example" pack --pack-destination "$RUNNER_TEMP/tarballs"

      # npm (not pnpm) for OIDC trusted publishing, no NPM_TOKEN secret. The
      # trusted publishers on npmjs.com only allow staging: the versions go
      # live after a maintainer runs `npm stage approve <id>` (2FA).
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Stage npm publish
        run: |
          for tarball in "$RUNNER_TEMP"/tarballs/*.tgz; do
            npm stage publish "$tarball" --provenance --access public
          done

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.changelog }}"
        env:
          GH_TOKEN: ${{ github.token }}
